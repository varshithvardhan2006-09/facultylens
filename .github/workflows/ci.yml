name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      JWT_SECRET: ci-only-jwt-secret-that-is-long-enough-for-tests
      STUDENT_HASH_SALT: ci-only-student-hash-salt-long-enough-for-tests
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      # Started as a step, not a service container, so a failed start shows MongoDB's own log.
      - name: Start MongoDB
        run: |
          docker run -d --name mongo -p 27017:27017 mongo:8.2
          for attempt in $(seq 1 30); do
            if docker exec mongo mongosh --quiet --eval 'db.runCommand({ping:1}).ok' 2>/dev/null | grep -q 1; then
              echo "MongoDB is ready"
              exit 0
            fi
            sleep 2
          done
          docker logs mongo | tail -40
          echo "::error::MongoDB did not start: $(docker logs mongo 2>&1 | tail -3 | tr -d '\n' | cut -c1-400)"
          exit 1
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt
      - run: pip install torch --index-url https://download.pytorch.org/whl/cpu
      - run: pip install -r requirements-dev.txt
      - run: python -m spacy download en_core_web_sm
      - run: python -m nltk.downloader punkt_tab stopwords wordnet omw-1.4 vader_lexicon
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest -q -rs -m "not slow and not network" --cov=app --cov-fail-under=70

  frontend:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run build
