[project]
name = "facultylens-backend"
version = "0.1.0"
requires-python = ">=3.13"

[tool.ruff]
line-length = 100
target-version = "py313"
extend-exclude = [".venv", ".hf_cache"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "ASYNC"]
ignore = ["SIM905"]  # word lists read better as "a b c".split()

[tool.ruff.lint.isort]
known-first-party = ["app", "ml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
  "slow: loads a real model (run with -m slow)",
  "network: calls real ORCID / Semantic Scholar (run with -m network)",
]
addopts = "-m \"not slow and not network\""

[tool.coverage.run]
source = ["app"]
